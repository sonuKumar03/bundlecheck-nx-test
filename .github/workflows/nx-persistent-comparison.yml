name: Nx BundleCheck Affected & Persistent Memory Comparison

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  bundlecheck-affected:
    name: Build Affected & Compare Persistent Memory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Restore Nx Cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Install dependencies
        run: npm ci

      - name: Build affected applications with stats.json
        run: |
          BASE_REF="origin/${{ github.base_ref || 'master' }}"
          echo "Comparing changes against base: $BASE_REF"
          npx nx affected -t build --base="$BASE_REF" --head=HEAD --configuration=production --stats-json

          # If neither portal nor admin-dashboard was affected, build both for comparison purposes
          if [ ! -f "dist/apps/portal/stats.json" ] && [ ! -f "dist/apps/admin-dashboard/stats.json" ]; then
            echo "Neither comparison app was affected; running fallback build for portal and admin-dashboard..."
            npm run build:apps
          fi

      # ----------------------------------------------------------------------
      # App 1: Portal - WITH Persistent Memory (Artifact Baselines)
      # ----------------------------------------------------------------------
      - name: BundleCheck - Portal (With Persistent Memory)
        if: hashFiles('dist/apps/portal/stats.json') != ''
        uses: sonuKumar03/bundlecheck@master
        with:
          project: portal
          artifact-baseline: true
          upload-artifact-baseline: ${{ github.ref == 'refs/heads/master' }}
          post-comment: false
          output: bundle-report-portal.md

      # ----------------------------------------------------------------------
      # App 2: Admin Dashboard - WITHOUT Persistent Memory (Standard)
      # ----------------------------------------------------------------------
      - name: BundleCheck - Admin Dashboard (Without Persistent Memory)
        if: hashFiles('dist/apps/admin-dashboard/stats.json') != ''
        uses: sonuKumar03/bundlecheck@master
        with:
          project: admin-dashboard
          artifact-baseline: false
          upload-artifact-baseline: false
          post-comment: false
          output: bundle-report-admin.md

      # ----------------------------------------------------------------------
      # Summary & Artifact Upload
      # ----------------------------------------------------------------------
      - name: Publish Comparison to Step Summary
        if: always()
        run: |
          echo "## 📊 Nx BundleCheck Comparison Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "bundle-report-portal.md" ]; then
            echo "### 🚀 Portal (Persistent Memory Enabled)" >> $GITHUB_STEP_SUMMARY
            cat bundle-report-portal.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "bundle-report-admin.md" ]; then
            echo "### 📦 Admin Dashboard (Standard / No Persistent Memory)" >> $GITHUB_STEP_SUMMARY
            cat bundle-report-admin.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Bundle Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx-bundle-reports
          path: bundle-report-*.md
          if-no-files-found: ignore
